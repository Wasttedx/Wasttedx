<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArmanKianian | Floating Portal</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at center, rgba(10, 10, 46, 1) 0%, rgba(5, 5, 20, 1) 50%, rgba(0, 0, 0, 1) 100%);
      font-family: 'Exo 2', sans-serif;
      overflow-x: hidden;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    .orb-1 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.2) 0%, transparent 70%);
      top: -150px;
      left: -100px;
      animation: orb-float-1 20s ease-in-out infinite;
    }

    .orb-2 {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(255, 0, 255, 0.15) 0%, transparent 70%);
      bottom: -120px;
      right: -80px;
      animation: orb-float-2 18s ease-in-out infinite reverse;
    }

    .orb-3 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.25) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: orb-pulse 25s ease-in-out infinite;
    }

    @keyframes orb-float-1 {
      0%, 100% {
        transform: translate(0, 0) scale(1);
        opacity: 0.3;
      }
      50% {
        transform: translate(60px, -40px) scale(1.1);
        opacity: 0.5;
      }
    }

    @keyframes orb-float-2 {
      0%, 100% {
        transform: translate(0, 0) scale(1);
        opacity: 0.25;
      }
      50% {
        transform: translate(-50px, 50px) scale(1.15);
        opacity: 0.45;
      }
    }

    @keyframes orb-pulse {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.2;
      }
      50% {
        transform: translate(-50%, -60%) scale(1.2);
        opacity: 0.35;
      }
    }

    .portal-container {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 4rem;
      padding: 3rem 2rem;
    }

    .bubble-portal {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
      animation: bubble-float 6s ease-in-out infinite;
    }

    .bubble-portal:nth-child(1) { animation-delay: 0s; }
    .bubble-portal:nth-child(2) { animation-delay: 0.8s; }
    .bubble-portal:nth-child(3) { animation-delay: 1.6s; }
    .bubble-portal:nth-child(4) { animation-delay: 2.4s; }
    .bubble-portal:nth-child(5) { animation-delay: 3.2s; }
    .bubble-portal:nth-child(6) { animation-delay: 4s; }
    .bubble-portal:nth-child(7) { animation-delay: 4.8s; }

    @keyframes bubble-float {
      0%, 100% {
        transform: translateY(0px) scale(1);
      }
      50% {
        transform: translateY(-25px) scale(1.05);
      }
    }

    .bubble-ring {
      position: absolute;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.1) 0%, transparent 50%);
      z-index: -1;
      animation: ring-pulse 3s ease-in-out infinite;
    }

    .bubble-portal:nth-child(1) .bubble-ring {
      width: 400px;
      height: 400px;
      animation-delay: 0s;
    }

    .bubble-portal:nth-child(2) .bubble-ring {
      width: 380px;
      height: 380px;
      animation-delay: 0.5s;
    }

    .bubble-portal:nth-child(3) .bubble-ring {
      width: 420px;
      height: 420px;
      animation-delay: 1s;
    }

    .bubble-portal:nth-child(4) .bubble-ring {
      width: 400px;
      height: 400px;
      animation-delay: 1.5s;
    }

    .bubble-portal:nth-child(5) .bubble-ring {
      width: 390px;
      height: 390px;
      animation-delay: 2s;
    }

    .bubble-portal:nth-child(6) .bubble-ring {
      width: 420px;
      height: 420px;
      animation-delay: 2.5s;
    }

    .bubble-portal:nth-child(7) .bubble-ring {
      width: 400px;
      height: 400px;
      animation-delay: 3s;
    }

    @keyframes ring-pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.6;
      }
      50% {
        transform: scale(1.2);
        opacity: 0.3;
      }
    }

    .bubble {
      position: relative;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.25) 0%, rgba(255, 215, 0, 0.15) 50%, rgba(212, 175, 55, 0.25) 100%);
      border: 3px solid rgba(255, 215, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow:
        0 0 30px rgba(212, 175, 55, 0.4),
        inset 0 0 20px rgba(255, 255, 255, 0.1),
        inset 0 0 40px rgba(212, 175, 55, 0.2),
        0 10px 40px rgba(0, 0, 0, 0.3),
        0 -5px 20px rgba(255, 215, 0, 0.2);
      backdrop-filter: blur(10px), brightness(1.1);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      overflow: hidden;
    }

    .bubble::before {
      content: '';
      position: absolute;
      top: 10%;
      left: 20%;
      width: 30%;
      height: 20%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      filter: blur(5px);
      animation: bubble-highlight 4s ease-in-out infinite alternate;
    }

    @keyframes bubble-highlight {
      0% {
        transform: translateX(0) translateY(0);
        opacity: 0.3;
      }
      100% {
        transform: translateX(20px) translateY(10px);
        opacity: 0.5;
      }
    }

    .bubble-portal:hover .bubble {
      transform: scale(1.15) rotate(-3deg);
      box-shadow:
        0 0 60px rgba(212, 175, 55, 0.8),
        inset 0 0 30px rgba(255, 255, 255, 0.2),
        inset 0 0 60px rgba(212, 175, 55, 0.3),
        0 20px 60px rgba(0, 0, 0, 0.4),
        0 -10px 30px rgba(255, 215, 0, 0.4);
      border-color: rgba(255, 255, 255, 0.9);
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.35) 0%, rgba(255, 215, 0, 0.25) 50%, rgba(212, 175, 55, 0.35) 100%);
    }

    .bubble-portal:hover .bubble-ring {
      animation: ring-pulse 1.5s ease-in-out infinite;
    }

    .bubble-portal:hover {
      transform: translateY(-35px) scale(1.1);
    }

    .bubble-icon {
      font-size: 3rem;
      line-height: 1;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
      filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.6));
    }

    .bubble-label {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #FFD700;
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.8);
      white-space: nowrap;
    }

    .bubble-sub {
      font-size: 0.65rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
    }

    .portal-header {
      text-align: center;
      position: relative;
      z-index: 10;
      padding: 3rem 2rem;
      animation: title-fade-in 1.2s ease-out;
    }

    .portal-header h1 {
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      color: #FFD700;
      text-transform: uppercase;
      text-shadow: 0 0 50px rgba(212, 175, 55, 0.7);
      margin-bottom: 0.5rem;
    }

    .portal-header p {
      font-size: 1.25rem;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 500;
      text-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }

    @keyframes title-fade-in {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .bubble-portal {
        animation-delay: 0s !important;
      }

      .bubble-portal:nth-child(n + 2) {
        margin-top: 2rem;
      }

      .portal-header h1 {
        font-size: 2.5rem;
      }

      .bubble {
        width: 120px;
        height: 120px;
      }

      .bubble-icon {
        font-size: 2.5rem;
      }

      .bubble-label {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <header class="portal-header">
    <h1>Floating Portal</h1>
    <p>Explore my digital universe</p>
  </header>

  <nav class="portal-container">
    <div class="bubble-portal" onclick="window.location.href='index.html'">
      <div class="bubble-ring"></div>
      <div class="bubble">
        <span class="bubble-icon">🏠</span>
        <span class="bubble-label">Home</span>
      </div>
    </div>

    <div class="bubble-portal" onclick="window.location.href='pages/projects.html'">
      <div class="bubble-ring"></div>
      <div class="bubble">
        <span class="bubble-icon">💻</span>
        <span class="bubble-label">Projects</span>
      </div>
    </div>

    <div class="bubble-portal" onclick="window.location.href='pages/about.html'">
      <div class="bubble-ring"></div>
      <div class="bubble">
        <span class="bubble-icon">👤</span>
        <span class="bubble-label">About</span>
      </div>
    </div>

    <div class="bubble-portal" onclick="window.location.href='pages/games.html'">
      <div class="bubble-ring"></div>
      <div class="bubble">
        <span class="bubble-icon">🎮</span>
        <span class="bubble-label">Games</span>
      </div>
    </div>

    <div class="bubble-portal" onclick="window.location.href='pages/tools.html'">
      <div class="bubble-ring"></div>
      <div class="bubble">
        <span class="bubble-icon">🔧</span>
        <span class="bubble-label">Tools</span>
      </div>
    </div>

    <div class="bubble-portal" onclick="window.location.href='pages/blog.html'">
      <div class="bubble-ring"></div>
      <div class="bubble">
        <span class="bubble-icon">📝</span>
        <span class="bubble-label">Blog</span>
      </div>
    </div>

    <div class="bubble-portal" onclick="window.location.href='pages/contact.html'">
      <div class="bubble-ring"></div>
      <div class="bubble">
        <span class="bubble-icon">✉️</span>
        <span class="bubble-label">Contact</span>
      </div>
    </div>
  </nav>
</body>
</html>
